services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collab_code
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
    ports:
      - "55432:5432"
    volumes:
      - collab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_code"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

volumes:
  collab-postgres-data:
