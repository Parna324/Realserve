services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collab_code
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_code"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab_code
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-before-prod
      JWT_EXPIRES_IN: 7d
      SNAPSHOT_INTERVAL_MS: 10000
      FRONTEND_ORIGIN: http://localhost:3000
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab_code
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-before-prod
      JWT_EXPIRES_IN: 7d
      SNAPSHOT_INTERVAL_MS: 10000
      FRONTEND_ORIGIN: http://localhost:3000
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "4000:4000"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - nginx

volumes:
  postgres-data:
